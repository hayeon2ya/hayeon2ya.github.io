{% assign theme = site.data.themes[site.ui_theme] %}
  <h4 class="card-title" style="font-family:{{ theme.education-title-font}};color:{{theme.education-font-color}};font-weight:bold;">Experience</h4>
  <ul class="list-unstyled">
  {% for entry in site.data.experience %}
    <li class="media mb-3 align-items-center">
      {% if entry.Icon %}<img src="{{ entry.Icon | relative_url }}" class="mr-3" alt="" style="width:50px;min-width:50px;max-width:50px;flex:0 0 50px;height:50px;object-fit:contain;">{% endif %}
      <div class="media-body">
        <h5 style="font-family:{{ theme.education-entry-font}};font-size:{{ theme.education-entry-size }};color:{{theme.education-font-color}};">{{ entry.Role }}, {{ entry.Organization }} ({{ entry.Period }})</h5>
      </div>
    </li>
    {% endfor %}
  </ul>
