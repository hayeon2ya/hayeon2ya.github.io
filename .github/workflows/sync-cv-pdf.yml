name: Sync CV PDF

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest CV PDF
        run: curl -fL https://raw.githubusercontent.com/hayeon2ya/resume-template-anubhav/main/main.pdf -o cv.pdf

      - name: Commit updated CV PDF
        run: |
          if git diff --quiet -- cv.pdf; then
            echo "CV PDF is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv.pdf
          git commit -m "Sync CV PDF"
          git push
