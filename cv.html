<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hayeon Lee CV</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: #f5f5f5;
    }

    #cv-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    #status {
      align-items: center;
      color: #333;
      display: flex;
      font: 16px/1.5 Arial, sans-serif;
      height: 100%;
      justify-content: center;
      margin: 0;
      text-align: center;
    }
  </style>
</head>
<body>
  <p id="status">Loading CV...</p>
  <iframe id="cv-frame" title="Hayeon Lee CV" hidden></iframe>
  <script>
    (function () {
      var latestCommit = 'https://api.github.com/repos/hayeon2ya/resume-template-anubhav/commits/main?v=' + Date.now();
      var fallback = 'https://cdn.jsdelivr.net/gh/hayeon2ya/resume-template-anubhav@main/main.pdf?v=' + Date.now();
      var status = document.getElementById('status');
      var frame = document.getElementById('cv-frame');

      function showPdf(url) {
        frame.src = url;
        frame.hidden = false;
        status.hidden = true;
      }

      fetch(latestCommit, { cache: 'no-store' })
        .then(function (response) {
          if (!response.ok) {
            throw new Error('Failed to load latest CV commit.');
          }
          return response.json();
        })
        .then(function (commit) {
          if (!commit.sha) {
            throw new Error('Missing CV commit SHA.');
          }
          showPdf('https://cdn.jsdelivr.net/gh/hayeon2ya/resume-template-anubhav@' + commit.sha + '/main.pdf');
        })
        .catch(function () {
          showPdf(fallback);
        });
    }());
  </script>
</body>
</html>
